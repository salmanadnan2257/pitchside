<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13221A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313221A'/%3E%3Ccircle cx='16' cy='17' r='10' fill='none' stroke='%2346B97F' stroke-width='3'/%3E%3Cpath d='M16 11v6l4 3M13 3h6' stroke='%2346B97F' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<title>Training Log</title>
<style>
:root{color-scheme:dark;--deep:#13221A;--card:#1B2E23;--line:#3A5446;--text:#EEF3EF;--muted:#A9B8AE;--go:#46B97F;--bad:#F2A08F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--deep);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 16px 32px}
h1{font-size:1.6rem;margin:0 0 6px}
p{margin:0 0 20px;color:var(--muted)}
form{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{font-weight:600;font-size:.95rem}
input[type=password]{width:100%;font:inherit;font-size:1.1rem;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--text)}
input[type=password]:focus-visible,button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.keep{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
.keep input{width:20px;height:20px;accent-color:var(--go)}
button{font:600 1.05rem/1 system-ui,sans-serif;padding:14px;border-radius:10px;border:0;background:var(--go);color:#0D1A13;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--go);transition:width .2s}
#msg{min-height:1.4em;margin:0;color:var(--muted)}
#msg.bad{color:var(--bad)}
/* a key kept on this device opens the log by itself: no password box, just the bar */
.auto #f>:not(.bar):not(#msg){display:none}
.auto #ask{display:none}
</style>
</head>
<body>
<main>
  <h1>Training Log</h1>
  <p id="ask">Type the password to open it.</p>
  <script>try { var k = localStorage.getItem("pitchside-key"); if (k && k.indexOf(":") > 0) document.documentElement.className = "auto"; } catch (e) {}</script>
  <form id="f" autocomplete="on" onsubmit="return false">
    <input type="text" name="username" value="pitchside" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="keep"><input id="keep" type="checkbox" checked> Keep it open on this device</label>
    <button id="go" type="submit" disabled>Loading...</button>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <p id="msg" role="status">Loading the log...</p>
  </form>
</main>
<script>
(function () {
  "use strict";
  // Filled in by pitchside.py: the salt and rounds of the password's key, the app's iv and file, the store's address.
  var D = {"salt": "7450524754d04445342844766b906fde", "rounds": 600000, "iv": "5627d1c67eec4998a2883b4e", "file": "app.bin?v=c7368c85fe77", "size": 6895068, "api": "https://pitchside-sync.salmanadnan2257.workers.dev"}, STORE = "pitchside-key";
  var $ = function (id) { return document.getElementById(id); };
  var hexb = function (h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; };
  var toHex = function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); };
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var set = function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  var say = function (t, bad) { $("msg").textContent = t; $("msg").className = bad ? "bad" : ""; };
  if (!window.crypto || !crypto.subtle || !window.fetch) { say("This browser cannot open it (no Web Crypto).", true); return; }
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").then(null, function () {}); } catch (e) {} }

  // The app downloads on its own, with a bar, so a password typed early simply waits for it.
  var app = null, waiting = null;
  function download() {
    return fetch(D.file, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var total = +r.headers.get("Content-Length") || D.size || 0;
      if (!r.body || !r.body.getReader) return r.arrayBuffer();
      var rd = r.body.getReader(), parts = [], got = 0;
      return (function pump() {
        return rd.read().then(function (x) {
          if (x.done) { var u = new Uint8Array(got), o = 0; parts.forEach(function (p) { u.set(p, o); o += p.length; }); return u.buffer; }
          parts.push(x.value); got += x.value.length;
          if (total) $("bar").style.width = Math.min(100, Math.round(got * 100 / total)) + "%";
          return pump();
        });
      })();
    });
  }
  var loaded = download().then(function (buf) {
    app = buf; $("bar").style.width = "100%"; $("go").disabled = false; $("go").textContent = "Open";
    if (!waiting) say("");
    return buf;
  }, function () {
    say("Could not load the log. Check the connection; it tries again in a few seconds.", true);
    setTimeout(function () { location.reload(); }, 5000);
    throw new Error("load");
  });

  // keep: remember the key on this device. It is written before the log replaces this page, as nothing of this
  // page's script is sure to run after that.
  function open(bits, keep) {
    return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]).then(function (k) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: hexb(D.iv) }, k, app);
    }).then(function (plain) {
      var kh = toHex(bits);
      if (keep != null) set(STORE, keep ? D.salt + ":" + kh : null);
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode("pitchside-auth:" + kh)).then(function (t) {
        window.__PITCHSIDE = { api: D.api, kh: kh, token: toHex(t) };
        var html = new TextDecoder().decode(plain);
        document.open(); document.write(html); document.close();
      });
    });
  }
  function fromPassword(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function (k) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hexb(D.salt), iterations: D.rounds }, k, 256);
    });
  }
  // A key kept from last time (for this password's salt) opens it as soon as the app is here.
  // The password box is hidden from the start in that case (the class set in the page's head); a key that no
  // longer opens it is dropped and the box comes back. A failed download keeps the key: the page tries again.
  var kept = get(STORE), parts = kept ? kept.split(":") : null;
  var ask = function () { document.documentElement.className = ""; };
  if (parts && parts[0] === D.salt && parts[1] && parts[1].length === 64) {
    waiting = true; say("Opening the log...");
    loaded.then(function () {
      return open(hexb(parts[1])).then(null, function () { waiting = null; set(STORE, null); ask(); say(""); });
    }, function () {});
  } else ask();
  $("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = $("pw").value, keep = $("keep").checked;
    if (!pw || !app) return;
    $("go").disabled = true; say("Opening...");
    fromPassword(pw).then(function (bits) {
      return open(new Uint8Array(bits), keep);
    }).then(null, function () {
      $("go").disabled = false; say("That password did not open it.", true); $("pw").select();
    });
  });
})();
</script>
</body>
</html>
